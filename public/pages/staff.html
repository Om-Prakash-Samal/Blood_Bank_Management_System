<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff - Blood Bank Management</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="brand">🩸 Blood Bank</div>
        <ul class="nav-links">
            <li><a href="/dashboard">Dashboard</a></li>
            <li><a href="/donors">Donors</a></li>
            <li><a href="/donations">Donations</a></li>
            <li><a href="/inventory">Blood Inventory</a></li>
            <li><a href="/tests">Tests</a></li>
            <li><a href="/patients">Patients</a></li>
            <li><a href="/requests">Requests</a></li>
            <li><a href="/hospitals">Hospitals</a></li>
            <li><a href="/staff" class="active">Staff</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Staff Management</h1>
            <button id="logoutBtn" class="btn btn-logout">Logout</button>
        </div>

        <div class="card">
            <h2>Add New Staff</h2>
            <form id="addStaffForm" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
                <div class="form-group">
                    <label>Staff Name</label>
                    <input type="text" id="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <input type="text" id="role" class="form-control" placeholder="e.g. Nurse, Doctor, Admin" required>
                </div>
                <div class="form-group">
                    <label>Bank ID</label>
                    <input type="number" id="bankId" class="form-control" placeholder="Enter Bank ID (e.g. 1)">
                </div>
                <div style="grid-column: 1 / -1;">
                    <button type="submit" class="btn btn-primary">Add Staff</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2>Staff List</h2>
            <table style="margin-top: 15px;">
                <thead>
                    <tr>
                        <th>Staff ID</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Bank ID</th>
                    </tr>
                </thead>
                <tbody id="staffTable">
                    <tr><td colspan="4">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        async function loadStaff() {
            try {
                const data = await fetchAPI('/staff');
                const tbody = document.getElementById('staffTable');
                tbody.innerHTML = '';
                
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4">No staff found</td></tr>';
                    return;
                }

                data.forEach(s => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${s.Staff_ID}</td>
                            <td>${s.Name}</td>
                            <td>${s.Role}</td>
                            <td>${s.Bank_ID || 'N/A'}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error(err);
                alert('Failed to load staff');
            }
        }

        document.getElementById('addStaffForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                Name: document.getElementById('name').value,
                Role: document.getElementById('role').value,
                Bank_ID: document.getElementById('bankId').value || null
            };

            try {
                await fetchAPI('/staff', {
                    method: 'POST',
                    body: JSON.stringify(body)
                });
                document.getElementById('addStaffForm').reset();
                loadStaff();
            } catch (err) {
                alert('Failed to add staff');
            }
        });

        document.addEventListener('DOMContentLoaded', loadStaff);
    </script>
</body>
</html>
