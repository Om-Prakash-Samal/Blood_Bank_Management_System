<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donations - Blood Bank Management</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="brand">🩸 Blood Bank</div>
        <ul class="nav-links">
            <li><a href="/dashboard">Dashboard</a></li>
            <li><a href="/donors">Donors</a></li>
            <li><a href="/donations" class="active">Donations</a></li>
            <li><a href="/inventory">Blood Inventory</a></li>
            <li><a href="/tests">Tests</a></li>
            <li><a href="/patients">Patients</a></li>
            <li><a href="/requests">Requests</a></li>
            <li><a href="/hospitals">Hospitals</a></li>
            <li><a href="/staff">Staff</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Record Donations</h1>
            <button id="logoutBtn" class="btn btn-logout">Logout</button>
        </div>

        <div class="card">
            <h2>Record New Donation</h2>
            <form id="addDonationForm" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
                <div class="form-group">
                    <label>Select Donor</label>
                    <select id="donorId" class="form-control" required>
                        <option value="">Select...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Blood Type</label>
                    <select id="bloodType" class="form-control" required>
                        <option value="">Select...</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Donation Date</label>
                    <input type="date" id="donationDate" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Volume (ml)</label>
                    <input type="number" id="volume" class="form-control" required value="450">
                </div>
                <div style="grid-column: 1 / -1;">
                    <button type="submit" class="btn btn-primary">Record Donation & Create Blood Bag</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2>Donation History</h2>
            <table style="margin-top: 15px;">
                <thead>
                    <tr>
                        <th>Donation #</th>
                        <th>Date</th>
                        <th>Volume</th>
                        <th>Donor Name</th>
                    </tr>
                </thead>
                <tbody id="donationTable">
                    <tr><td colspan="4">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        async function loadDonors() {
            try {
                const data = await fetchAPI('/donors');
                const select = document.getElementById('donorId');
                data.forEach(donor => {
                    const option = document.createElement('option');
                    option.value = donor.Donor_ID;
                    option.textContent = `${donor.Name} (ID: ${donor.Donor_ID})`;
                    select.appendChild(option);
                });
            } catch (err) {
                console.error('Failed to load donors for select');
            }
        }

        async function loadDonations() {
            try {
                const data = await fetchAPI('/donations');
                const tbody = document.getElementById('donationTable');
                tbody.innerHTML = '';
                
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4">No donations found</td></tr>';
                    return;
                }

                data.forEach(d => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${d.Donation_Number}</td>
                            <td>${new Date(d.Donation_Date).toLocaleDateString()}</td>
                            <td>${d.Volume} ml</td>
                            <td>${d.DonorName || 'Unknown'}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error(err);
                alert('Failed to load donations');
            }
        }

        document.getElementById('addDonationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                Donor_ID: document.getElementById('donorId').value,
                Blood_Type: document.getElementById('bloodType').value,
                Donation_Date: document.getElementById('donationDate').value,
                Volume: document.getElementById('volume').value
            };

            try {
                await fetchAPI('/donations', {
                    method: 'POST',
                    body: JSON.stringify(body)
                });
                alert('Donation recorded and Blood Bag generated successfully!');
                document.getElementById('addDonationForm').reset();
                loadDonations();
            } catch (err) {
                alert('Failed to add donation');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadDonors();
            loadDonations();
            document.getElementById('donationDate').valueAsDate = new Date();
        });
    </script>
</body>
</html>
